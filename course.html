<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course — Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  try{ document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; }catch(e){}
</script>
</head>
<!--
  This page is a TEMPLATE: the same file serves every course.
  main.js reads ?course=<id> from the URL, finds that course in courses.json,
  and fills in the empty elements below (identified by their id="").
-->
<body data-page="course">

<a href="#notes" class="skip-link">Skip to notes</a>

<nav aria-label="Main">
  <a href="index.html" class="logo">NOTES<span>·</span>HUB</a>
  <ul class="nav-links">
    <li><a href="index.html#courses">← All courses</a></li>
    <li>
      <button type="button" class="theme-toggle" aria-label="Switch to light mode">
        <span class="icon" aria-hidden="true">☀</span><span class="label">light</span>
      </button>
    </li>
  </ul>
</nav>

<main id="course-main">

<header class="course-hero" id="course-hero">
  <span class="course-icon" id="course-icon" aria-hidden="true"></span>
  <div>
    <div class="code" id="course-code"></div>
    <h1 id="course-name">Loading…</h1>
    <p id="course-desc"></p>
  </div>
</header>

<section class="section" id="notes">
  <div class="section-head">
    <div>
      <h2>Notes</h2>
      <p>Click a title to read it in the browser, or download the PDF directly.</p>
    </div>
    <div class="search">
      <label for="search" class="sr-only">Search notes in this course</label>
      <input id="search" type="search" placeholder="search this course…" autocomplete="off">
    </div>
  </div>

  <!-- One chip per tag, generated by main.js. role=group + aria-label names the control. -->
  <div class="tag-filters" id="tag-filters" role="group" aria-label="Filter by tag"></div>
  <div id="search-count" class="result-count" aria-live="polite"></div>

  <ul class="note-list" id="note-list"></ul>
</section>

</main>

<footer>
  Notes — a shared knowledge base, one course at a time
</footer>

<script src="js/main.js"></script>
</body>
</html>
